<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>业务员登录</title><link rel="stylesheet" href="./style.css"></head><body>
<div class="login-wrap"><div class="login-box"><div class="pill">业务员入口</div><h1 style="margin-top:12px">登录客户登记系统</h1><div class="muted">使用管理员为你创建的业务员邮箱和密码登录。</div><div class="field" style="margin-top:20px"><label>业务员账号（邮箱）</label><input id="email" type="email" autocomplete="username" placeholder="name@example.com"></div><div class="field" style="margin-top:12px"><label>密码</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn primary" style="width:100%;margin-top:18px">登录</button><div class="row" style="margin-top:14px"><a href="./index.html" class="small">返回首页</a><div class="spacer"></div><button id="resetBtn" class="btn soft" type="button">忘记密码</button></div><div id="note" class="notice" hidden></div></div></div>
<script type="module">
import { base44, showMessage } from './base44.js';
const email=document.getElementById('email'),password=document.getElementById('password'),note=document.getElementById('note'),loginBtn=document.getElementById('loginBtn');
async function tryExisting(){try{const u=await base44.auth.me();if(u){location.href=u.role==='admin'?'./admin.html':'./sales.html'}}catch(_){} }
loginBtn.onclick=async()=>{const e=email.value.trim(),p=password.value;if(!e||!p){showMessage(note,'请输入账号和密码。','err');return}loginBtn.disabled=true;showMessage(note,'正在登录…');try{await base44.auth.loginViaEmailPassword(e,p);const u=await base44.auth.me();location.href=u?.role==='admin'?'./admin.html':'./sales.html'}catch(err){showMessage(note,'登录失败，请检查账号和密码。','err')}finally{loginBtn.disabled=false}};
document.getElementById('resetBtn').onclick=async()=>{const e=email.value.trim();if(!e){showMessage(note,'请先输入业务员邮箱。','warn');return}try{await base44.auth.resetPassword(e);showMessage(note,'密码重置邮件已发送，请查看邮箱。','ok')}catch(err){showMessage(note,'暂时无法发送重置邮件。','err')}};
tryExisting();
</script></body></html>
