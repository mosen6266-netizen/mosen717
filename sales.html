<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>业务员客户登记</title><link rel="stylesheet" href="./style.css"></head><body>
<div class="topbar"><div><div class="brand">客户登记系统</div><div id="who" class="subbrand"></div></div><div class="row"><button id="newBtn" class="btn primary">＋ 登记客户</button><button id="logoutBtn" class="btn soft">退出</button></div></div>
<div class="shell"><div class="stats"><div class="stat"><div id="myCount" class="n">0</div><div class="l">我的客户</div></div><div class="stat"><div id="fieldCount" class="n">0</div><div class="l">当前登记项目</div></div><div class="stat"><div id="todayCount" class="n">0</div><div class="l">今日新增</div></div></div>
<div class="card"><div class="row"><div><h2 style="margin:0">我的客户</h2><div class="small">当前业务员：<b id="repLabel"></b></div></div><div class="spacer"></div><input id="search" class="search" placeholder="搜索客户信息…"></div><div id="customerList" style="margin-top:16px"></div></div></div>
<div id="modal" class="modal" hidden><div class="modal-card"><div class="row"><h2 id="modalTitle" style="margin:0">登记客户</h2><div class="spacer"></div><button id="closeModal" class="btn soft">关闭</button></div><form id="customerForm"><div id="dynamicFields" class="grid" style="margin-top:18px"></div><div class="row" style="margin-top:18px"><button class="btn primary" type="submit">保存客户</button><button id="cancelEdit" class="btn soft" type="button">取消</button></div></form><div id="formNote" class="notice" hidden></div></div></div>
<script type="module">
import { base44, esc, showMessage, buildFieldControl, formatDate } from './base44.js';
let username=localStorage.getItem('m717_rep_username')||'',displayName=localStorage.getItem('m717_rep_display_name')||'',fields=[],customers=[],editingId=null;
const modal=document.getElementById('modal'),form=document.getElementById('customerForm'),note=document.getElementById('formNote'),list=document.getElementById('customerList');
async function boot(){if(!username){location.href='./login.html';return}try{const reps=await base44.entities.SalesRep.list('-created_date',500);const rep=reps.find(r=>String(r.username||'').toLowerCase()===username.toLowerCase());if(!rep){localStorage.removeItem('m717_rep_username');location.href='./login.html';return}displayName=rep.display_name||rep.username;document.getElementById('who').textContent=displayName;document.getElementById('repLabel').textContent=username;await Promise.all([loadFields(),loadCustomers()]);try{base44.entities.FormField.subscribe(()=>loadFields());base44.entities.Customer.subscribe(()=>loadCustomers());base44.entities.SalesRep.subscribe(()=>verifyRep())}catch(_){}}catch(_){location.href='./login.html'}}
async function verifyRep(){const reps=await base44.entities.SalesRep.list('-created_date',500);if(!reps.some(r=>String(r.username||'').toLowerCase()===username.toLowerCase())){localStorage.removeItem('m717_rep_username');location.href='./login.html'}}
async function loadFields(){fields=(await base44.entities.FormField.list('-order',500)).filter(x=>x.active!==false).sort((a,b)=>(a.order||0)-(b.order||0));document.getElementById('fieldCount').textContent=fields.length;renderForm()}
async function loadCustomers(){const all=await base44.entities.Customer.list('-created_date',1000);customers=all.filter(r=>String(r.rep_username||'').toLowerCase()===username.toLowerCase());renderCustomers();document.getElementById('myCount').textContent=customers.length;const today=new Date().toISOString().slice(0,10);document.getElementById('todayCount').textContent=customers.filter(x=>String(x.created_date||'').slice(0,10)===today).length}
function renderForm(data={}){document.getElementById('dynamicFields').innerHTML=fields.map(f=>buildFieldControl(f,data[f.field_key]??'')).join('')}
function openForm(row=null){editingId=row?.id||null;document.getElementById('modalTitle').textContent=editingId?'编辑客户':'登记客户';renderForm(row?.data||{});note.hidden=true;modal.hidden=false}
function renderCustomers(){const q=document.getElementById('search').value.trim().toLowerCase();const rows=customers.filter(r=>JSON.stringify(r.data||{}).toLowerCase().includes(q));if(!rows.length){list.innerHTML='<div class="empty">暂无客户记录</div>';return}list.innerHTML='<div class="table-wrap"><table><thead><tr><th>登记时间</th>'+fields.map(f=>'<th>'+esc(f.label)+'</th>').join('')+'<th>操作</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(formatDate(r.created_date))+'</td>'+fields.map(f=>'<td>'+esc(r.data?.[f.field_key]||'')+'</td>').join('')+'<td><div class="row"><button class="btn soft edit" data-id="'+r.id+'">编辑</button><button class="btn danger del" data-id="'+r.id+'">删除</button></div></td></tr>').join('')+'</tbody></table></div>';list.querySelectorAll('.edit').forEach(b=>b.onclick=()=>openForm(customers.find(x=>x.id===b.dataset.id)));list.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{if(!confirm('确定删除这条客户记录吗？'))return;await base44.entities.Customer.delete(b.dataset.id);await loadCustomers()})}
form.onsubmit=async e=>{e.preventDefault();const data={};form.querySelectorAll('[data-key]').forEach(el=>data[el.dataset.key]=el.value);try{if(editingId)await base44.entities.Customer.update(editingId,{rep_username:username,data});else await base44.entities.Customer.create({rep_username:username,data});showMessage(note,'已保存并同步。','ok');await loadCustomers();setTimeout(()=>modal.hidden=true,400)}catch(err){showMessage(note,'保存失败：'+(err?.message||'未知错误'),'err')}};
document.getElementById('newBtn').onclick=()=>openForm();document.getElementById('closeModal').onclick=()=>modal.hidden=true;document.getElementById('cancelEdit').onclick=()=>modal.hidden=true;document.getElementById('search').oninput=renderCustomers;document.getElementById('logoutBtn').onclick=()=>{localStorage.removeItem('m717_rep_username');localStorage.removeItem('m717_rep_display_name');location.href='./login.html'};modal.onclick=e=>{if(e.target===modal)modal.hidden=true};boot();
</script></body></html>
