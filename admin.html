<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客户登记系统 · 管理员</title><link rel="stylesheet" href="./style.css"></head><body>
<div id="loginView" class="login-wrap"><div class="login-box"><div class="pill">管理员入口</div><h1 style="margin-top:12px">登录管理后台</h1><div class="muted">请输入管理员密码。</div><div class="field" style="margin-top:20px"><label>管理员密码</label><input id="adminPassword" type="password" autocomplete="current-password" placeholder="请输入密码"></div><button id="adminLogin" class="btn primary" style="width:100%;margin-top:18px">登录</button><div id="loginNote" class="notice" hidden></div></div></div>

<div id="appView" hidden>
  <div class="topbar">
    <div><div class="brand">客户登记系统 · 管理员</div><div class="subbrand">客户与业务员管理</div></div>
    <div class="row"><a href="./login.html" class="btn soft hide-mobile">业务员入口</a><button id="logoutBtn" class="btn soft">退出</button></div>
  </div>

  <div class="shell admin-shell">
    <aside class="admin-sidebar">
      <div class="sidebar-card">
        <div class="sidebar-section-title">客户视图</div>
        <button class="sidebar-item active" data-view="all">
          <span class="sidebar-icon">▦</span><span class="sidebar-text">全部客户</span><span id="allCustomerCount" class="sidebar-count">0</span>
        </button>
        <div id="repCustomerNav" class="rep-customer-nav"></div>
        <div class="sidebar-divider"></div>
        <div class="sidebar-section-title">管理</div>
        <button class="sidebar-item" data-view="reps"><span class="sidebar-icon">◎</span><span class="sidebar-text">业务员管理</span></button>
        <button class="sidebar-item" data-view="fields"><span class="sidebar-icon">≡</span><span class="sidebar-text">登记字段</span><span id="sidebarFieldCount" class="sidebar-count">0</span></button>
        <button class="sidebar-item" data-view="progress"><span class="sidebar-icon">✓</span><span class="sidebar-text">客户进度</span><span id="sidebarProgressCount" class="sidebar-count">0</span></button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="stats">
        <div class="stat"><div id="totalCustomers" class="n">0</div><div class="l">全部客户</div></div>
        <div class="stat"><div id="salesCount" class="n">0</div><div class="l">业务员用户名</div></div>
        <div class="stat"><div id="activeFields" class="n">0</div><div class="l">启用登记项目</div></div>
      </div>

      <section id="view-customers" class="admin-view">
        <div class="card">
          <div class="row">
            <div>
              <h2 id="customerViewTitle" style="margin:0">全部客户</h2>
              <div id="customerViewDesc" class="small">显示所有业务员登记的客户。管理员可编辑、删除任意客户。</div>
            </div>
            <div class="spacer"></div>
            <input id="customerSearch" class="search" placeholder="搜索客户信息…">
            <button id="exportBtn" class="btn soft">导出 CSV</button>
            <button id="refreshCustomers" class="btn soft">刷新</button>
          </div>
          <div id="customerList" style="margin-top:16px"></div>
        </div>
      </section>

      <section id="view-reps" class="admin-view" hidden>
        <div class="card">
          <div class="section-title"><div class="dot"></div><h2>业务员管理</h2><div class="spacer"></div><span class="pill">用户名登录 · 无需密码</span></div>
          <div class="grid3">
            <div class="field"><label>业务员用户名</label><input id="repUsername" placeholder="例如 zhangsan"></div>
            <div class="field"><label>显示名称（可选）</label><input id="repDisplayName" placeholder="例如 张三"></div>
          </div>
          <div class="row" style="margin-top:14px"><button id="createRep" class="btn primary">创建业务员用户名</button><button id="refreshReps" class="btn soft">刷新列表</button></div>
          <div id="repNote" class="notice" hidden></div>
          <div id="repList" style="margin-top:16px"></div>
        </div>
      </section>

      <section id="view-fields" class="admin-view" hidden>
        <div class="card">
          <div class="section-title"><div class="dot"></div><h2>登记字段管理</h2><div class="spacer"></div><span class="pill">拖拽排序 · 业务员自动同步</span></div>
          <div class="grid3">
            <div class="field"><label>字段名称</label><input id="fieldLabel" placeholder="例如 客户生日"></div>
            <div class="field"><label>字段类型</label><select id="fieldType"><option value="text">文本</option><option value="number">数字</option><option value="date">日期</option><option value="email">邮箱</option><option value="tel">电话</option><option value="textarea">长文本</option><option value="select">下拉选项</option></select></div>
            <div class="field"><label>下拉选项（逗号分隔）</label><input id="fieldOptions" placeholder="例如 高,中,低"></div>
            <div class="field"><label>是否必填</label><select id="fieldRequired"><option value="false">非必填</option><option value="true">必填</option></select></div>
          </div>
          <button id="addField" class="btn primary" style="margin-top:14px">添加登记项目</button>
          <div id="fieldNote" class="notice" hidden></div>
          <div id="fieldList" style="margin-top:16px"></div>
        </div>
      </section>

      <section id="view-progress" class="admin-view" hidden>
        <div class="card">
          <div class="section-title"><div class="dot"></div><h2>客户进度管理</h2><div class="spacer"></div><span class="pill">拖拽排序 · 业务员自动同步</span></div>
          <div class="row">
            <div class="field" style="min-width:300px;flex:1"><label>新增进度名称</label><input id="progressLabel" placeholder="例如 已联系 / 跟进中 / 已成交"></div>
            <button id="addProgress" class="btn primary" style="align-self:flex-end">添加进度</button>
          </div>
          <div id="progressNote" class="notice" hidden></div>
          <div id="progressList" style="margin-top:16px"></div>
        </div>
      </section>
    </main>
  </div>
</div>

<div id="customerModal" class="modal" hidden>
  <div class="modal-card">
    <div class="row"><h2 style="margin:0">编辑客户</h2><div class="spacer"></div><button id="closeCustomerModal" class="btn soft">关闭</button></div>
    <div class="field" style="margin-top:18px"><label>所属业务员</label><select id="editRep"></select></div>
    <form id="customerEditForm"><div id="customerEditFields" class="grid" style="margin-top:16px"></div><div class="row" style="margin-top:18px"><button class="btn primary" type="submit">保存修改</button><button id="cancelCustomerEdit" class="btn soft" type="button">取消</button></div></form>
    <div id="customerEditNote" class="notice" hidden></div>
  </div>
</div>

<script type="module">
import { base44, esc, showMessage, buildFieldControl, formatDate, downloadCsv } from './base44.js';
const ADMIN_HASH='78fd5f1e5a3f6eef05ab8d692942fd0ff4a8f4cc0e6087026626006a7fae452d';
let reps=[],fields=[],customers=[],progressStages=[],editingCustomerId=null,draggedFieldId=null,dragSaving=false,draggedProgressId=null,progressDragSaving=false;
let currentView='all',currentRepFilter='';

const loginView=document.getElementById('loginView'),appView=document.getElementById('appView'),loginNote=document.getElementById('loginNote');
const customerModal=document.getElementById('customerModal'),customerEditForm=document.getElementById('customerEditForm'),customerEditNote=document.getElementById('customerEditNote');

function unwrap(v){return Array.isArray(v)?v:(v?.items||[])}
async function sha256(v){const b=new TextEncoder().encode(v);const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}

function showAdminView(view,repUsername=''){
  currentView=view;currentRepFilter=repUsername||'';
  document.querySelectorAll('.admin-view').forEach(x=>x.hidden=true);
  document.querySelectorAll('.sidebar-item').forEach(x=>x.classList.remove('active'));

  if(view==='all'||view==='rep'){
    document.getElementById('view-customers').hidden=false;
    if(view==='all'){
      document.querySelector('.sidebar-item[data-view="all"]').classList.add('active');
      document.getElementById('customerViewTitle').textContent='全部客户';
      document.getElementById('customerViewDesc').textContent='显示所有业务员登记的客户。管理员可编辑、删除任意客户。';
    }else{
      const rep=reps.find(r=>String(r.username||'')===String(repUsername));
      const btn=[...document.querySelectorAll('.sidebar-item[data-rep]')].find(x=>x.dataset.rep===repUsername);
      if(btn)btn.classList.add('active');
      const name=rep?.display_name||rep?.username||repUsername;
      document.getElementById('customerViewTitle').textContent=name+' 的客户';
      document.getElementById('customerViewDesc').textContent='只显示业务员 '+repUsername+' 登记的客户。';
    }
    renderCustomers();return;
  }
  if(view==='reps'){document.getElementById('view-reps').hidden=false;document.querySelector('.sidebar-item[data-view="reps"]').classList.add('active')}
  if(view==='fields'){document.getElementById('view-fields').hidden=false;document.querySelector('.sidebar-item[data-view="fields"]').classList.add('active')}
  if(view==='progress'){document.getElementById('view-progress').hidden=false;document.querySelector('.sidebar-item[data-view="progress"]').classList.add('active')}
}
document.querySelector('.sidebar-item[data-view="all"]').onclick=()=>showAdminView('all');
document.querySelector('.sidebar-item[data-view="reps"]').onclick=()=>showAdminView('reps');
document.querySelector('.sidebar-item[data-view="fields"]').onclick=()=>showAdminView('fields');
document.querySelector('.sidebar-item[data-view="progress"]').onclick=()=>showAdminView('progress');

async function enter(){
  loginView.hidden=true;appView.hidden=false;
  await Promise.all([loadReps(),loadFields(),loadProgress(),loadCustomers()]);
  showAdminView('all');
  try{
    base44.entities.SalesRep.subscribe(()=>loadReps());
    base44.entities.FormField.subscribe(()=>{if(!dragSaving){loadFields();loadCustomers()}});
    base44.entities.ProgressStage.subscribe(()=>{if(!progressDragSaving){loadProgress();loadCustomers()}});
    base44.entities.Customer.subscribe(()=>loadCustomers());
  }catch(_){}
}
document.getElementById('adminLogin').onclick=async()=>{
  const p=document.getElementById('adminPassword').value;
  if(!p){showMessage(loginNote,'请输入管理员密码。','err');return}
  if(await sha256(p)!==ADMIN_HASH){showMessage(loginNote,'管理员密码错误。','err');return}
  localStorage.setItem('m717_admin','1');await enter()
};

async function loadReps(){
  try{
    reps=unwrap(await base44.entities.SalesRep.list({sort:'-created_date',limit:500}));
    document.getElementById('salesCount').textContent=reps.length;
    renderReps();renderSidebar();
  }catch(err){document.getElementById('repList').innerHTML='<div class="notice err">读取业务员失败：'+esc(err?.message||String(err))+'</div>'}
}
function renderSidebar(){
  const nav=document.getElementById('repCustomerNav');
  nav.innerHTML=reps.map(r=>{
    const count=customers.filter(c=>String(c.rep_username||'')===String(r.username||'')).length;
    const label=r.display_name||r.username||'未命名';
    return '<button class="sidebar-item" data-view="rep" data-rep="'+esc(r.username||'')+'"><span class="sidebar-avatar">'+esc(String(label).slice(0,1).toUpperCase())+'</span><span class="sidebar-text"><b>'+esc(label)+'</b><small>'+esc(r.username||'')+'</small></span><span class="sidebar-count">'+count+'</span></button>';
  }).join('');
  nav.querySelectorAll('.sidebar-item[data-rep]').forEach(btn=>btn.onclick=()=>showAdminView('rep',btn.dataset.rep));
}
function renderReps(){
  const box=document.getElementById('repList');
  if(!reps.length){box.innerHTML='<div class="empty">还没有业务员用户名</div>';return}
  box.innerHTML='<div class="table-wrap"><table><thead><tr><th>用户名</th><th>显示名称</th><th>客户数</th><th>创建时间</th><th>操作</th></tr></thead><tbody>'+reps.map(r=>{
    const count=customers.filter(c=>String(c.rep_username||'')===String(r.username||'')).length;
    return '<tr><td><b>'+esc(r.username||'')+'</b></td><td>'+esc(r.display_name||'')+'</td><td>'+count+'</td><td>'+esc(formatDate(r.created_date))+'</td><td><button class="btn danger delrep" data-id="'+r.id+'">删除</button></td></tr>';
  }).join('')+'</tbody></table></div>';
  box.querySelectorAll('.delrep').forEach(b=>b.onclick=async()=>{if(!confirm('删除这个业务员用户名？'))return;await base44.entities.SalesRep.delete(b.dataset.id);await loadReps()})
}
document.getElementById('createRep').onclick=async()=>{
  const username=document.getElementById('repUsername').value.trim(),display_name=document.getElementById('repDisplayName').value.trim(),note=document.getElementById('repNote');
  if(!username){showMessage(note,'请输入业务员用户名。','err');return}
  try{
    const current=unwrap(await base44.entities.SalesRep.list({sort:'-created_date',limit:500}));
    if(current.some(r=>String(r.username||'').toLowerCase()===username.toLowerCase())){showMessage(note,'这个用户名已经存在。','err');return}
    await base44.entities.SalesRep.create({username,display_name});showMessage(note,'业务员用户名已创建：'+username,'ok');
    document.getElementById('repUsername').value='';document.getElementById('repDisplayName').value='';await loadReps()
  }catch(err){showMessage(note,'创建失败：'+(err?.message||String(err)),'err')}
};

async function loadFields(){
  try{
    fields=unwrap(await base44.entities.FormField.list({sort:'order',limit:500})).sort((a,b)=>(a.order||0)-(b.order||0));
    const activeCount=fields.filter(f=>f.active!==false).length;
    document.getElementById('activeFields').textContent=activeCount;document.getElementById('sidebarFieldCount').textContent=activeCount;
    renderFields();
  }catch(err){document.getElementById('fieldList').innerHTML='<div class="notice err">读取登记字段失败：'+esc(err?.message||String(err))+'</div>'}
}
function renderFields(){
  const box=document.getElementById('fieldList');
  if(!fields.length){box.innerHTML='<div class="empty">暂无登记项目</div>';return}
  box.innerHTML='<div class="field-sort-list">'+fields.map((f,i)=>'<div class="field-sort-row" draggable="true" data-id="'+f.id+'"><div class="drag-handle">☰</div><div class="field-sort-name"><b>'+esc(f.label)+'</b><span>'+esc(f.field_type)+(f.required?' · 必填':'')+'</span></div><div class="field-sort-order">第 '+(i+1)+' 项</div><div class="row"><button class="btn soft toggle" data-id="'+f.id+'" data-active="'+(f.active!==false)+'">'+(f.active===false?'启用':'停用')+'</button><button class="btn danger remove" data-id="'+f.id+'">删除</button></div></div>').join('')+'</div>';
  box.querySelectorAll('.toggle').forEach(b=>b.onclick=async e=>{e.stopPropagation();await base44.entities.FormField.update(b.dataset.id,{active:b.dataset.active!=='true'});await loadFields()});
  box.querySelectorAll('.remove').forEach(b=>b.onclick=async e=>{e.stopPropagation();if(!confirm('确定删除这个登记字段吗？'))return;await base44.entities.FormField.delete(b.dataset.id);await loadFields()});
  box.querySelectorAll('.field-sort-row').forEach(row=>{
    row.ondragstart=e=>{draggedFieldId=row.dataset.id;row.classList.add('dragging');e.dataTransfer.effectAllowed='move'};
    row.ondragend=()=>{row.classList.remove('dragging');draggedFieldId=null};
    row.ondragover=e=>e.preventDefault();
    row.ondrop=async e=>{e.preventDefault();if(!draggedFieldId||draggedFieldId===row.dataset.id)return;const from=fields.findIndex(x=>x.id===draggedFieldId),to=fields.findIndex(x=>x.id===row.dataset.id);const next=[...fields],m=next.splice(from,1)[0];next.splice(to,0,m);fields=next;renderFields();await saveFieldOrder()}
  });
}
async function saveFieldOrder(){
  const note=document.getElementById('fieldNote');dragSaving=true;
  try{for(let i=0;i<fields.length;i++)await base44.entities.FormField.update(fields[i].id,{order:i+1});fields=fields.map((f,i)=>({...f,order:i+1}));renderFields();showMessage(note,'排序已保存。','ok')}
  catch(err){showMessage(note,'保存排序失败：'+(err?.message||String(err)),'err');await loadFields()}finally{dragSaving=false}
}
document.getElementById('addField').onclick=async()=>{
  const label=document.getElementById('fieldLabel').value.trim(),type=document.getElementById('fieldType').value,options=document.getElementById('fieldOptions').value.trim(),required=document.getElementById('fieldRequired').value==='true',note=document.getElementById('fieldNote');
  if(!label){showMessage(note,'请输入字段名称。','err');return}
  try{
    const nextOrder=fields.length?Math.max(...fields.map(f=>Number(f.order)||0))+1:1;
    await base44.entities.FormField.create({label,field_key:'f_'+Date.now(),field_type:type,options,required,order:nextOrder,active:true});
    showMessage(note,'字段已添加。','ok');document.getElementById('fieldLabel').value='';document.getElementById('fieldOptions').value='';await loadFields()
  }catch(err){showMessage(note,'添加失败：'+(err?.message||'未知错误'),'err')}
};

async function loadProgress(){
  try{
    progressStages=unwrap(await base44.entities.ProgressStage.list({sort:'order',limit:500})).filter(x=>x.active!==false).sort((a,b)=>(a.order||0)-(b.order||0));
    document.getElementById('sidebarProgressCount').textContent=progressStages.length;renderProgress();
  }catch(err){document.getElementById('progressList').innerHTML='<div class="notice err">读取客户进度失败：'+esc(err?.message||String(err))+'</div>'}
}
function renderProgress(){
  const box=document.getElementById('progressList');
  if(!progressStages.length){box.innerHTML='<div class="empty">还没有客户进度，先添加一个。</div>';return}
  box.innerHTML='<div class="field-sort-list">'+progressStages.map((p,i)=>'<div class="field-sort-row progress-sort-row" draggable="true" data-id="'+p.id+'"><div class="drag-handle">☰</div><div class="field-sort-name"><input class="progress-name-input" data-id="'+p.id+'" value="'+esc(p.label)+'"><span>第 '+(i+1)+' 步</span></div><div class="field-sort-order">'+(i+1)+'</div><div class="row"><button class="btn soft save-progress" data-id="'+p.id+'">保存名称</button><button class="btn danger delete-progress" data-id="'+p.id+'">删除</button></div></div>').join('')+'</div>';
  box.querySelectorAll('.save-progress').forEach(b=>b.onclick=async()=>{const input=box.querySelector('.progress-name-input[data-id="'+b.dataset.id+'"]');const label=input.value.trim();if(!label)return;await base44.entities.ProgressStage.update(b.dataset.id,{label});await loadProgress()});
  box.querySelectorAll('.delete-progress').forEach(b=>b.onclick=async()=>{if(!confirm('删除这个客户进度？已有客户的历史勾选不会再显示这个步骤。'))return;await base44.entities.ProgressStage.delete(b.dataset.id);await loadProgress()});
  box.querySelectorAll('.progress-sort-row').forEach(row=>{
    row.ondragstart=e=>{draggedProgressId=row.dataset.id;row.classList.add('dragging');e.dataTransfer.effectAllowed='move'};
    row.ondragend=()=>{row.classList.remove('dragging');draggedProgressId=null};
    row.ondragover=e=>e.preventDefault();
    row.ondrop=async e=>{e.preventDefault();if(!draggedProgressId||draggedProgressId===row.dataset.id)return;const from=progressStages.findIndex(x=>x.id===draggedProgressId),to=progressStages.findIndex(x=>x.id===row.dataset.id);const next=[...progressStages],m=next.splice(from,1)[0];next.splice(to,0,m);progressStages=next;renderProgress();await saveProgressOrder()}
  });
}
async function saveProgressOrder(){
  const note=document.getElementById('progressNote');progressDragSaving=true;
  try{for(let i=0;i<progressStages.length;i++)await base44.entities.ProgressStage.update(progressStages[i].id,{order:i+1});progressStages=progressStages.map((p,i)=>({...p,order:i+1}));renderProgress();showMessage(note,'进度顺序已保存。','ok')}
  catch(err){showMessage(note,'保存排序失败：'+(err?.message||String(err)),'err');await loadProgress()}finally{progressDragSaving=false}
}
document.getElementById('addProgress').onclick=async()=>{
  const label=document.getElementById('progressLabel').value.trim(),note=document.getElementById('progressNote');if(!label){showMessage(note,'请输入进度名称。','err');return}
  try{const nextOrder=progressStages.length?Math.max(...progressStages.map(p=>Number(p.order)||0))+1:1;await base44.entities.ProgressStage.create({label,order:nextOrder,active:true});document.getElementById('progressLabel').value='';showMessage(note,'进度已添加。','ok');await loadProgress()}
  catch(err){showMessage(note,'添加失败：'+(err?.message||String(err)),'err')}
};

function progressDetail(row){
  if(!progressStages.length)return '<div class="preview-progress-block"><div class="preview-progress-head"><b>客户进度</b><strong>0%</strong></div><div class="percent-progress"><span style="width:0%"></span></div><div class="small" style="margin-top:8px">管理员还没有设置客户进度。</div></div>';
  const done=new Set((row.completed_progress_ids||[]).map(String));
  const completed=progressStages.filter(p=>done.has(String(p.id))).length;
  const percent=Math.round(completed/progressStages.length*100);
  return '<div class="preview-progress-block"><div class="preview-progress-head"><b>客户进度</b><strong>'+percent+'%</strong></div><div class="percent-progress"><span style="width:'+percent+'%"></span></div><div class="preview-progress-meta">已完成 '+completed+' / '+progressStages.length+' 项</div><div class="preview-stage-list">'+progressStages.map((p,i)=>'<div class="preview-stage '+(done.has(String(p.id))?'done':'')+'"><span class="preview-stage-check">'+(done.has(String(p.id))?'✓':'')+'</span><span class="preview-stage-index">'+(i+1)+'</span><span class="preview-stage-label">'+esc(p.label)+'</span></div>').join('')+'</div></div>';
}
function previewCard(row){
  const active=fields.filter(f=>f.active!==false).sort((a,b)=>(a.order||0)-(b.order||0));
  const rep=reps.find(r=>String(r.username||'')===String(row.rep_username||''));
  return '<div class="customer-preview"><div class="preview-panel-head"><div><div class="preview-title">客户完整信息</div><div class="preview-subtitle">所有登记资料与当前跟进进度</div></div><span class="preview-rep-badge">'+esc(rep?.display_name||row.rep_username||'未指定业务员')+'</span></div><div class="preview-grid preview-grid-large"><div><span>业务员用户名</span><b>'+esc(row.rep_username||'—')+'</b></div><div><span>登记时间</span><b>'+esc(formatDate(row.created_date)||'—')+'</b></div>'+active.map(f=>'<div class="'+(f.field_type==='textarea'?'preview-full':'')+'"><span>'+esc(f.label)+'</span><b>'+esc(row.data?.[f.field_key]||'—')+'</b></div>').join('')+'</div>'+progressDetail(row)+'</div>';
}
function bindPreviewHover(container){
  container.querySelectorAll('.preview-wrap').forEach(w=>{
    const panel=w.querySelector('.customer-preview');let timer;
    const open=()=>{clearTimeout(timer);panel.classList.add('open')};
    const closeLater=()=>{clearTimeout(timer);timer=setTimeout(()=>panel.classList.remove('open'),280)};
    w.onmouseenter=open;w.onmouseleave=closeLater;
    panel.onmouseenter=open;panel.onmouseleave=closeLater;
  });
}

async function loadCustomers(){
  try{
    customers=unwrap(await base44.entities.Customer.list({sort:'-created_date',limit:1000}));
    document.getElementById('totalCustomers').textContent=customers.length;document.getElementById('allCustomerCount').textContent=customers.length;
    renderCustomers();renderSidebar();renderReps();
  }catch(err){document.getElementById('customerList').innerHTML='<div class="notice err">读取客户失败：'+esc(err?.message||String(err))+'</div>'}
}
function getVisibleCustomers(){
  const q=document.getElementById('customerSearch').value.trim().toLowerCase();
  return customers.filter(r=>{if(currentView==='rep'&&String(r.rep_username||'')!==String(currentRepFilter||''))return false;return (String(r.rep_username||'')+' '+JSON.stringify(r.data||{})).toLowerCase().includes(q)})
}
function renderCustomers(){
  const active=fields.filter(f=>f.active!==false).sort((a,b)=>(a.order||0)-(b.order||0)),rows=getVisibleCustomers(),box=document.getElementById('customerList');
  if(!rows.length){box.innerHTML='<div class="empty">暂无匹配客户</div>';return}
  const eye='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.8" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';
  box.innerHTML='<div class="table-wrap customer-table"><table><thead><tr><th>业务员用户名</th><th>登记时间</th>'+active.map(f=>'<th>'+esc(f.label)+'</th>').join('')+'<th>操作</th></tr></thead><tbody>'+rows.map(r=>'<tr><td><b>'+esc(r.rep_username||'')+'</b></td><td>'+esc(formatDate(r.created_date))+'</td>'+active.map(f=>'<td>'+esc(r.data?.[f.field_key]||'')+'</td>').join('')+'<td><div class="row nowrap"><span class="preview-wrap"><button class="eye-btn" type="button" aria-label="预览完整客户信息">'+eye+'</button>'+previewCard(r)+'</span><button class="btn soft editcustomer" data-id="'+r.id+'">编辑</button><button class="btn danger delcustomer" data-id="'+r.id+'">删除</button></div></td></tr>').join('')+'</tbody></table></div>';
  bindPreviewHover(box);
  box.querySelectorAll('.editcustomer').forEach(b=>b.onclick=()=>openCustomerEditor(customers.find(x=>x.id===b.dataset.id)));
  box.querySelectorAll('.delcustomer').forEach(b=>b.onclick=async()=>{const row=customers.find(x=>x.id===b.dataset.id);if(!row||!confirm('确定删除这条客户记录吗？'))return;await base44.entities.Customer.delete(row.id);await loadCustomers()})
}
function openCustomerEditor(row){
  if(!row)return;editingCustomerId=row.id;
  const active=fields.filter(f=>f.active!==false).sort((a,b)=>(a.order||0)-(b.order||0));
  document.getElementById('editRep').innerHTML=['<option value="">未指定</option>',...reps.map(r=>'<option value="'+esc(r.username)+'" '+(String(row.rep_username||'')===String(r.username||'')?'selected':'')+'>'+esc(r.display_name||r.username)+' ('+esc(r.username)+')</option>')].join('');
  document.getElementById('customerEditFields').innerHTML=active.map(f=>buildFieldControl(f,row.data?.[f.field_key]??'')).join('');
  customerEditNote.hidden=true;customerModal.hidden=false;
}
customerEditForm.onsubmit=async e=>{
  e.preventDefault();const row=customers.find(x=>x.id===editingCustomerId);if(!row)return;
  const data={...(row.data||{})};customerEditForm.querySelectorAll('[data-key]').forEach(el=>data[el.dataset.key]=el.value);
  try{await base44.entities.Customer.update(row.id,{rep_username:document.getElementById('editRep').value,data});showMessage(customerEditNote,'客户资料已更新。','ok');await loadCustomers();setTimeout(()=>customerModal.hidden=true,350)}
  catch(err){showMessage(customerEditNote,'保存失败：'+(err?.message||String(err)),'err')}
};

document.getElementById('exportBtn').onclick=()=>{
  const active=fields.filter(f=>f.active!==false).sort((a,b)=>(a.order||0)-(b.order||0)),rows=getVisibleCustomers();
  downloadCsv(currentView==='rep'?(currentRepFilter+'_客户数据.csv'):'客户登记数据.csv',[['业务员用户名','登记时间',...active.map(f=>f.label),'已完成进度'],...rows.map(r=>[r.rep_username||'',formatDate(r.created_date),...active.map(f=>r.data?.[f.field_key]||''),(r.completed_progress_ids||[]).map(id=>progressStages.find(p=>String(p.id)===String(id))?.label||'').filter(Boolean).join(' / ')])])
};
document.getElementById('customerSearch').oninput=renderCustomers;document.getElementById('refreshCustomers').onclick=loadCustomers;document.getElementById('refreshReps').onclick=loadReps;
document.getElementById('closeCustomerModal').onclick=()=>customerModal.hidden=true;document.getElementById('cancelCustomerEdit').onclick=()=>customerModal.hidden=true;customerModal.onclick=e=>{if(e.target===customerModal)customerModal.hidden=true};
document.getElementById('logoutBtn').onclick=()=>{localStorage.removeItem('m717_admin');location.reload()};
if(localStorage.getItem('m717_admin')==='1')enter();
</script></body></html>
