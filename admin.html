<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客户登记系统 · 管理员</title><link rel="stylesheet" href="./style.css"></head><body>
<div id="loginView" class="login-wrap"><div class="login-box"><div class="pill">管理员入口</div><h1 style="margin-top:12px">登录管理后台</h1><div class="muted">使用创建这个系统时的管理员账号登录。</div><button id="googleLogin" class="btn blue" style="width:100%;margin-top:20px">使用 Google 登录</button><div class="divider">或者邮箱密码</div><div class="field"><label>管理员邮箱</label><input id="adminEmail" type="email" autocomplete="username"></div><div class="field" style="margin-top:12px"><label>密码</label><input id="adminPassword" type="password" autocomplete="current-password"></div><button id="adminLogin" class="btn primary" style="width:100%;margin-top:18px">登录</button><div id="loginNote" class="notice" hidden></div></div></div>
<div id="appView" hidden><div class="topbar"><div><div class="brand">客户登记系统 · 管理员</div><div id="who" class="subbrand"></div></div><div class="row"><a href="./login.html" class="btn soft hide-mobile">业务员入口</a><button id="logoutBtn" class="btn soft">退出</button></div></div><div class="shell"><div class="stats"><div class="stat"><div id="totalCustomers" class="n">0</div><div class="l">全部客户</div></div><div class="stat"><div id="salesCount" class="n">0</div><div class="l">业务员账号</div></div><div class="stat"><div id="activeFields" class="n">0</div><div class="l">启用登记项目</div></div></div>
<div class="card"><div class="section-title"><div class="dot"></div><h2>业务员账号</h2><div class="spacer"></div><span class="pill">账号密码登录</span></div><div class="grid3"><div class="field"><label>姓名 / 备注名</label><input id="salesName" placeholder="例如 张三"></div><div class="field"><label>登录邮箱</label><input id="salesEmail" type="email" placeholder="sales01@example.com"></div><div class="field"><label>初始密码</label><input id="salesPassword" type="text" placeholder="至少 8 位"></div></div><div class="row" style="margin-top:14px"><button id="createSales" class="btn primary">创建业务员账号</button><button id="refreshUsers" class="btn soft">刷新账号列表</button></div><div id="accountNote" class="notice" hidden></div><div id="userList" style="margin-top:16px"></div></div>
<div class="card"><div class="section-title"><div class="dot"></div><h2>登记字段管理</h2><div class="spacer"></div><span class="pill">所有业务员自动同步</span></div><div class="grid3"><div class="field"><label>字段名称</label><input id="fieldLabel" placeholder="例如 客户生日"></div><div class="field"><label>字段类型</label><select id="fieldType"><option value="text">文本</option><option value="number">数字</option><option value="date">日期</option><option value="email">邮箱</option><option value="tel">电话</option><option value="textarea">长文本</option><option value="select">下拉选项</option></select></div><div class="field"><label>下拉选项（逗号分隔）</label><input id="fieldOptions" placeholder="例如 高,中,低"></div><div class="field"><label>排序</label><input id="fieldOrder" type="number" value="10"></div><div class="field"><label>是否必填</label><select id="fieldRequired"><option value="false">非必填</option><option value="true">必填</option></select></div></div><button id="addField" class="btn primary" style="margin-top:14px">添加登记项目</button><div id="fieldNote" class="notice" hidden></div><div id="fieldList" style="margin-top:16px"></div></div>
<div class="card"><div class="row"><div><h2 style="margin:0">全部客户登记数据</h2><div class="small">可按任意客户信息或业务员搜索。</div></div><div class="spacer"></div><input id="customerSearch" class="search" placeholder="搜索…"><button id="exportBtn" class="btn soft">导出 CSV</button><button id="refreshCustomers" class="btn soft">刷新</button></div><div id="customerList" style="margin-top:16px"></div></div>
</div></div>
<script type="module">
import { base44, createIsolatedClient, esc, showMessage, formatDate, downloadCsv } from './base44.js';
let currentUser=null,fields=[],customers=[],users=[];
const loginView=document.getElementById('loginView'),appView=document.getElementById('appView'),loginNote=document.getElementById('loginNote');
async function enter(){try{const u=await base44.auth.me();if(!u)return false;if(u.role!=='admin'){showMessage(loginNote,'该账号不是管理员账号。','err');await base44.auth.logout();return false}currentUser=u;loginView.hidden=true;appView.hidden=false;document.getElementById('who').textContent=u.full_name||u.email||'管理员';await Promise.all([loadFields(),loadCustomers(),loadUsers()]);try{base44.entities.FormField.subscribe(()=>{loadFields();loadCustomers()});base44.entities.Customer.subscribe(()=>loadCustomers())}catch(_){}return true}catch(_){return false}}
document.getElementById('googleLogin').onclick=async()=>{try{await base44.auth.loginWithProvider('google');}catch(err){showMessage(loginNote,'Google 登录未完成，请尝试邮箱密码登录。','err')}};
document.getElementById('adminLogin').onclick=async()=>{const e=document.getElementById('adminEmail').value.trim(),p=document.getElementById('adminPassword').value;if(!e||!p){showMessage(loginNote,'请输入管理员邮箱和密码。','err');return}showMessage(loginNote,'正在登录…');try{await base44.auth.loginViaEmailPassword(e,p);await enter()}catch(err){showMessage(loginNote,'登录失败，请检查管理员账号。','err')}};
async function loadUsers(){try{users=await base44.users.list();const staff=users.filter(u=>u.role!=='admin');document.getElementById('salesCount').textContent=staff.length;if(!staff.length){document.getElementById('userList').innerHTML='<div class="empty">还没有业务员账号</div>';return}document.getElementById('userList').innerHTML='<div class="table-wrap"><table><thead><tr><th>姓名</th><th>登录邮箱</th><th>角色</th><th>创建时间</th></tr></thead><tbody>'+staff.map(u=>'<tr><td>'+esc(u.full_name||'')+'</td><td>'+esc(u.email||'')+'</td><td>'+esc(u.role||'user')+'</td><td>'+esc(formatDate(u.created_date))+'</td></tr>').join('')+'</tbody></table></div>'}catch(err){document.getElementById('userList').innerHTML='<div class="notice warn">账号列表暂时无法读取，但不影响创建和使用业务员账号。</div>'}}
document.getElementById('createSales').onclick=async()=>{const name=document.getElementById('salesName').value.trim(),email=document.getElementById('salesEmail').value.trim(),password=document.getElementById('salesPassword').value,note=document.getElementById('accountNote');if(!email||password.length<8){showMessage(note,'请输入有效邮箱，密码至少 8 位。','err');return}showMessage(note,'正在创建业务员账号…');try{const temp=createIsolatedClient();await temp.auth.register({email,password});try{await temp.auth.updateMe({full_name:name||email.split('@')[0]})}catch(_){}try{await temp.auth.logout()}catch(_){}showMessage(note,'业务员账号已创建：'+email,'ok');document.getElementById('salesName').value='';document.getElementById('salesEmail').value='';document.getElementById('salesPassword').value='';await loadUsers()}catch(err){showMessage(note,'创建失败：'+(err?.message||'该邮箱可能已存在。'),'err')}};
async function loadFields(){fields=(await base44.entities.FormField.list()).sort((a,b)=>(a.order||0)-(b.order||0));document.getElementById('activeFields').textContent=fields.filter(f=>f.active!==false).length;const box=document.getElementById('fieldList');if(!fields.length){box.innerHTML='<div class="empty">暂无登记项目</div>';return}box.innerHTML='<div class="table-wrap"><table><thead><tr><th>名称</th><th>类型</th><th>必填</th><th>排序</th><th>状态</th><th>操作</th></tr></thead><tbody>'+fields.map(f=>'<tr><td>'+esc(f.label)+'</td><td>'+esc(f.field_type)+'</td><td>'+(f.required?'是':'否')+'</td><td>'+esc(f.order??0)+'</td><td>'+(f.active===false?'停用':'启用')+'</td><td><div class="row"><button class="btn soft toggle" data-id="'+f.id+'" data-active="'+(f.active!==false)+'">'+(f.active===false?'启用':'停用')+'</button><button class="btn danger remove" data-id="'+f.id+'">删除</button></div></td></tr>').join('')+'</tbody></table></div>';box.querySelectorAll('.toggle').forEach(b=>b.onclick=async()=>{await base44.entities.FormField.update(b.dataset.id,{active:b.dataset.active!=='true'});await loadFields()});box.querySelectorAll('.remove').forEach(b=>b.onclick=async()=>{if(!confirm('删除字段后，以前填写的数据仍会保留，但页面不再显示这个字段。确定删除吗？'))return;await base44.entities.FormField.delete(b.dataset.id);await loadFields()})}
document.getElementById('addField').onclick=async()=>{const label=document.getElementById('fieldLabel').value.trim(),type=document.getElementById('fieldType').value,options=document.getElementById('fieldOptions').value.trim(),order=Number(document.getElementById('fieldOrder').value)||0,required=document.getElementById('fieldRequired').value==='true',note=document.getElementById('fieldNote');if(!label){showMessage(note,'请输入字段名称。','err');return}try{await base44.entities.FormField.create({label,field_key:'f_'+Date.now(),field_type:type,options,required,order,active:true});showMessage(note,'字段已添加，业务员页面会自动同步。','ok');document.getElementById('fieldLabel').value='';document.getElementById('fieldOptions').value='';await loadFields()}catch(err){showMessage(note,'添加失败：'+(err?.message||'未知错误'),'err')}};
async function loadCustomers(){customers=await base44.entities.Customer.list('-created_date',500);document.getElementById('totalCustomers').textContent=customers.length;renderCustomers()}
function renderCustomers(){const q=document.getElementById('customerSearch').value.trim().toLowerCase(),active=fields.filter(f=>f.active!==false);const rows=customers.filter(r=>JSON.stringify(r.data||{}).toLowerCase().includes(q));const box=document.getElementById('customerList');if(!rows.length){box.innerHTML='<div class="empty">暂无匹配客户</div>';return}box.innerHTML='<div class="table-wrap"><table><thead><tr><th>业务员</th><th>登记时间</th>'+active.map(f=>'<th>'+esc(f.label)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.data?._sales_name||r.data?._sales_email||'')+'</td><td>'+esc(formatDate(r.created_date))+'</td>'+active.map(f=>'<td>'+esc(r.data?.[f.field_key]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
document.getElementById('exportBtn').onclick=()=>{const active=fields.filter(f=>f.active!==false);const rows=[['业务员','业务员邮箱','登记时间',...active.map(f=>f.label)],...customers.map(r=>[r.data?._sales_name||'',r.data?._sales_email||'',formatDate(r.created_date),...active.map(f=>r.data?.[f.field_key]||'')])];downloadCsv('客户登记数据.csv',rows)};
document.getElementById('customerSearch').oninput=renderCustomers;document.getElementById('refreshCustomers').onclick=loadCustomers;document.getElementById('refreshUsers').onclick=loadUsers;document.getElementById('logoutBtn').onclick=async()=>{await base44.auth.logout();location.reload()};enter();
</script></body></html>
