<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客户登记系统 · 管理员</title><link rel="stylesheet" href="./style.css"></head><body>
<div id="loginView" class="login-wrap"><div class="login-box"><div class="pill">管理员入口</div><h1 style="margin-top:12px">登录管理后台</h1><div class="muted">请输入管理员密码。</div><div class="field" style="margin-top:20px"><label>管理员密码</label><input id="adminPassword" type="password" autocomplete="current-password" placeholder="请输入密码"></div><button id="adminLogin" class="btn primary" style="width:100%;margin-top:18px">登录</button><div id="loginNote" class="notice" hidden></div></div></div>
<div id="appView" hidden><div class="topbar"><div><div class="brand">客户登记系统 · 管理员</div><div class="subbrand">用户名模式</div></div><div class="row"><a href="./login.html" class="btn soft hide-mobile">业务员入口</a><button id="logoutBtn" class="btn soft">退出</button></div></div><div class="shell">
<div class="stats"><div class="stat"><div id="totalCustomers" class="n">0</div><div class="l">全部客户</div></div><div class="stat"><div id="salesCount" class="n">0</div><div class="l">业务员用户名</div></div><div class="stat"><div id="activeFields" class="n">0</div><div class="l">启用登记项目</div></div></div>
<div class="card"><div class="section-title"><div class="dot"></div><h2>业务员用户名</h2><div class="spacer"></div><span class="pill">无需密码</span></div><div class="grid3"><div class="field"><label>业务员用户名</label><input id="repUsername" placeholder="例如 zhangsan"></div><div class="field"><label>显示名称（可选）</label><input id="repDisplayName" placeholder="例如 张三"></div></div><div class="row" style="margin-top:14px"><button id="createRep" class="btn primary">创建业务员用户名</button><button id="refreshReps" class="btn soft">刷新列表</button></div><div id="repNote" class="notice" hidden></div><div id="repList" style="margin-top:16px"></div></div>
<div class="card"><div class="section-title"><div class="dot"></div><h2>登记字段管理</h2><div class="spacer"></div><span class="pill">所有业务员自动同步</span></div><div class="grid3"><div class="field"><label>字段名称</label><input id="fieldLabel" placeholder="例如 客户生日"></div><div class="field"><label>字段类型</label><select id="fieldType"><option value="text">文本</option><option value="number">数字</option><option value="date">日期</option><option value="email">邮箱</option><option value="tel">电话</option><option value="textarea">长文本</option><option value="select">下拉选项</option></select></div><div class="field"><label>下拉选项（逗号分隔）</label><input id="fieldOptions" placeholder="例如 高,中,低"></div><div class="field"><label>排序</label><input id="fieldOrder" type="number" value="10"></div><div class="field"><label>是否必填</label><select id="fieldRequired"><option value="false">非必填</option><option value="true">必填</option></select></div></div><button id="addField" class="btn primary" style="margin-top:14px">添加登记项目</button><div id="fieldNote" class="notice" hidden></div><div id="fieldList" style="margin-top:16px"></div></div>
<div class="card"><div class="row"><div><h2 style="margin:0">全部客户登记数据</h2><div class="small">可按客户信息或业务员用户名搜索。</div></div><div class="spacer"></div><input id="customerSearch" class="search" placeholder="搜索…"><button id="exportBtn" class="btn soft">导出 CSV</button><button id="refreshCustomers" class="btn soft">刷新</button></div><div id="customerList" style="margin-top:16px"></div></div>
</div></div>
<script type="module">
import { base44, esc, showMessage, formatDate, downloadCsv } from './base44.js';
const ADMIN_HASH='78fd5f1e5a3f6eef05ab8d692942fd0ff4a8f4cc0e6087026626006a7fae452d';
let reps=[],fields=[],customers=[];
const loginView=document.getElementById('loginView'),appView=document.getElementById('appView'),loginNote=document.getElementById('loginNote');
async function sha256(v){const b=new TextEncoder().encode(v);const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function enter(){loginView.hidden=true;appView.hidden=false;await Promise.all([loadReps(),loadFields(),loadCustomers()]);try{base44.entities.SalesRep.subscribe(()=>loadReps());base44.entities.FormField.subscribe(()=>{loadFields();loadCustomers()});base44.entities.Customer.subscribe(()=>loadCustomers())}catch(_){}}
document.getElementById('adminLogin').onclick=async()=>{const p=document.getElementById('adminPassword').value;if(!p){showMessage(loginNote,'请输入管理员密码。','err');return}if(await sha256(p)!==ADMIN_HASH){showMessage(loginNote,'管理员密码错误。','err');return}localStorage.setItem('m717_admin','1');await enter()};
async function loadReps(){const result=await base44.entities.SalesRep.list({sort:'-created_date',limit:500});reps=Array.isArray(result)?result:(result?.items||[]);document.getElementById('salesCount').textContent=reps.length;const box=document.getElementById('repList');if(!reps.length){box.innerHTML='<div class="empty">还没有业务员用户名</div>';return}box.innerHTML='<div class="table-wrap"><table><thead><tr><th>用户名</th><th>显示名称</th><th>创建时间</th><th>操作</th></tr></thead><tbody>'+reps.map(r=>'<tr><td><b>'+esc(r.username||'')+'</b></td><td>'+esc(r.display_name||'')+'</td><td>'+esc(formatDate(r.created_date))+'</td><td><button class="btn danger delrep" data-id="'+r.id+'">删除</button></td></tr>').join('')+'</tbody></table></div>';box.querySelectorAll('.delrep').forEach(b=>b.onclick=async()=>{if(!confirm('删除这个业务员用户名？'))return;try{await base44.entities.SalesRep.delete(b.dataset.id);await loadReps()}catch(err){alert('删除失败：'+(err?.message||err))}})}
document.getElementById('createRep').onclick=async()=>{const username=document.getElementById('repUsername').value.trim(),display_name=document.getElementById('repDisplayName').value.trim(),note=document.getElementById('repNote');if(!username){showMessage(note,'请输入业务员用户名。','err');return}showMessage(note,'正在创建业务员用户名…');try{const result=await base44.entities.SalesRep.list({sort:'-created_date',limit:500});const current=Array.isArray(result)?result:(result?.items||[]);if(current.some(r=>String(r.username||'').toLowerCase()===username.toLowerCase())){showMessage(note,'这个用户名已经存在。','err');return}await base44.entities.SalesRep.create({username,display_name});showMessage(note,'业务员用户名已创建：'+username,'ok');document.getElementById('repUsername').value='';document.getElementById('repDisplayName').value='';await loadReps()}catch(err){showMessage(note,'创建失败：'+(err?.message||String(err)),'err')}};
async function loadFields(){fields=(await base44.entities.FormField.list('-order',500)).sort((a,b)=>(a.order||0)-(b.order||0));document.getElementById('activeFields').textContent=fields.filter(f=>f.active!==false).length;const box=document.getElementById('fieldList');if(!fields.length){box.innerHTML='<div class="empty">暂无登记项目</div>';return}box.innerHTML='<div class="table-wrap"><table><thead><tr><th>名称</th><th>类型</th><th>必填</th><th>排序</th><th>状态</th><th>操作</th></tr></thead><tbody>'+fields.map(f=>'<tr><td>'+esc(f.label)+'</td><td>'+esc(f.field_type)+'</td><td>'+(f.required?'是':'否')+'</td><td>'+esc(f.order??0)+'</td><td>'+(f.active===false?'停用':'启用')+'</td><td><div class="row"><button class="btn soft toggle" data-id="'+f.id+'" data-active="'+(f.active!==false)+'">'+(f.active===false?'启用':'停用')+'</button><button class="btn danger remove" data-id="'+f.id+'">删除</button></div></td></tr>').join('')+'</tbody></table></div>';box.querySelectorAll('.toggle').forEach(b=>b.onclick=async()=>{await base44.entities.FormField.update(b.dataset.id,{active:b.dataset.active!=='true'});await loadFields()});box.querySelectorAll('.remove').forEach(b=>b.onclick=async()=>{if(!confirm('确定删除这个登记字段吗？'))return;await base44.entities.FormField.delete(b.dataset.id);await loadFields()})}
document.getElementById('addField').onclick=async()=>{const label=document.getElementById('fieldLabel').value.trim(),type=document.getElementById('fieldType').value,options=document.getElementById('fieldOptions').value.trim(),order=Number(document.getElementById('fieldOrder').value)||0,required=document.getElementById('fieldRequired').value==='true',note=document.getElementById('fieldNote');if(!label){showMessage(note,'请输入字段名称。','err');return}try{await base44.entities.FormField.create({label,field_key:'f_'+Date.now(),field_type:type,options,required,order,active:true});showMessage(note,'字段已添加，业务员页面会自动同步。','ok');document.getElementById('fieldLabel').value='';document.getElementById('fieldOptions').value='';await loadFields()}catch(err){showMessage(note,'添加失败：'+(err?.message||'未知错误'),'err')}};
async function loadCustomers(){customers=await base44.entities.Customer.list('-created_date',1000);document.getElementById('totalCustomers').textContent=customers.length;renderCustomers()}
function renderCustomers(){const q=document.getElementById('customerSearch').value.trim().toLowerCase(),active=fields.filter(f=>f.active!==false);const rows=customers.filter(r=>(String(r.rep_username||'')+' '+JSON.stringify(r.data||{})).toLowerCase().includes(q));const box=document.getElementById('customerList');if(!rows.length){box.innerHTML='<div class="empty">暂无匹配客户</div>';return}box.innerHTML='<div class="table-wrap"><table><thead><tr><th>业务员用户名</th><th>登记时间</th>'+active.map(f=>'<th>'+esc(f.label)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr><td><b>'+esc(r.rep_username||'')+'</b></td><td>'+esc(formatDate(r.created_date))+'</td>'+active.map(f=>'<td>'+esc(r.data?.[f.field_key]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
document.getElementById('exportBtn').onclick=()=>{const active=fields.filter(f=>f.active!==false);downloadCsv('客户登记数据.csv',[['业务员用户名','登记时间',...active.map(f=>f.label)],...customers.map(r=>[r.rep_username||'',formatDate(r.created_date),...active.map(f=>r.data?.[f.field_key]||'')])])};
document.getElementById('customerSearch').oninput=renderCustomers;document.getElementById('refreshCustomers').onclick=loadCustomers;document.getElementById('refreshReps').onclick=loadReps;document.getElementById('logoutBtn').onclick=()=>{localStorage.removeItem('m717_admin');location.reload()};
if(localStorage.getItem('m717_admin')==='1')enter();
</script></body></html>
